<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nonogram</title>
  <meta name="description" content="Nonogram (paint-by-numbers) logic puzzles in your browser: 20 hand-made pictures and endless fair random grids that logic alone can solve. Works with touch, mouse and keyboard.">
  <meta name="theme-color" content="#0f172a">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Nonogram">
  <meta property="og:description" content="Paint-by-numbers logic puzzles: hand-made pictures and fair random grids, playable on phone and desktop.">
  <meta property="og:url" content="https://celaldrg.github.io/nonogram/">
  <meta property="og:image" content="https://celaldrg.github.io/nonogram/docs/screenshot.png">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231e293b'/%3E%3Cg fill='%23fdba74'%3E%3Crect x='5' y='5' width='6.5' height='6.5' rx='1.5'/%3E%3Crect x='12.75' y='5' width='6.5' height='6.5' rx='1.5'/%3E%3Crect x='12.75' y='12.75' width='6.5' height='6.5' rx='1.5'/%3E%3Crect x='20.5' y='12.75' width='6.5' height='6.5' rx='1.5'/%3E%3Crect x='5' y='20.5' width='6.5' height='6.5' rx='1.5'/%3E%3Crect x='20.5' y='20.5' width='6.5' height='6.5' rx='1.5'/%3E%3C/g%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css">
  <script type="module" src="src/main.js"></script>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <svg class="logo" viewBox="0 0 32 32" aria-hidden="true">
        <rect width="32" height="32" rx="8" fill="#1e293b"/>
        <g fill="#fdba74">
          <rect x="5" y="5" width="6.5" height="6.5" rx="1.5"/>
          <rect x="12.75" y="5" width="6.5" height="6.5" rx="1.5"/>
          <rect x="12.75" y="12.75" width="6.5" height="6.5" rx="1.5"/>
          <rect x="20.5" y="12.75" width="6.5" height="6.5" rx="1.5"/>
          <rect x="5" y="20.5" width="6.5" height="6.5" rx="1.5"/>
          <rect x="20.5" y="20.5" width="6.5" height="6.5" rx="1.5"/>
        </g>
      </svg>
      <h1>Nonogram</h1>
    </div>
    <nav class="top-actions" aria-label="Game" data-i18n-aria="gameMenu">
      <button type="button" class="btn btn-primary" id="new-game">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
        <span data-i18n="newGame">New game</span>
      </button>
      <button type="button" class="btn" id="restart">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12a9 9 0 1 0 2.6-6.4L3 8"/><path d="M3 3v5h5"/></svg>
        <span data-i18n="restart">Restart</span>
      </button>
      <button type="button" class="btn btn-lang" id="lang" aria-label="TR – switch to Turkish" data-i18n-aria="langSwitch">
        <span data-i18n="langShort">TR</span>
      </button>
    </nav>
  </header>

  <main class="layout">
    <section class="card play" aria-labelledby="puzzle-title">
      <div class="status">
        <div class="title-wrap">
          <h2 class="puzzle-title" id="puzzle-title">Nonogram</h2>
          <span class="chip" id="puzzle-size"></span>
        </div>
        <div class="stats">
          <span class="stat" title="Time" data-i18n-title="time">
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
            <span id="timer">0:00</span>
          </span>
          <span class="stat stat-mistakes" id="mistakes-stat" title="Mistakes" data-i18n-title="mistakes" hidden>
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="m15 9-6 6M9 9l6 6"/></svg>
            <span id="mistakes">0</span>
          </span>
        </div>
      </div>
      <div class="board-box" id="board-box">
        <div class="board">
          <div class="board-top">
            <div class="corner"></div>
            <div class="col-clues" aria-hidden="true"></div>
          </div>
          <div class="board-body">
            <div class="row-clues" aria-hidden="true"></div>
            <div class="cells" tabindex="0" role="application" aria-label="Puzzle grid" data-i18n-aria="gridLabel" aria-describedby="board-hint"></div>
          </div>
        </div>
      </div>
      <p class="hint" id="board-hint"></p>
    </section>

    <aside class="card panel" aria-label="Controls" data-i18n-aria="controls">
      <div class="tools" id="tools">
        <div class="segmented" role="group" aria-label="Tool" data-i18n-aria="toolGroup">
          <button type="button" class="seg" data-tool="fill" aria-pressed="true">
            <span class="tool-icon tool-fill" aria-hidden="true"></span><span data-i18n="toolFill">Fill</span>
          </button>
          <button type="button" class="seg" data-tool="cross" aria-pressed="false">
            <span class="tool-icon tool-cross" aria-hidden="true"></span><span data-i18n="toolCross">Cross</span>
          </button>
        </div>
        <div class="actions">
          <button type="button" class="btn act" id="undo" disabled>
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg>
            <span data-i18n="undo">Undo</span>
          </button>
          <button type="button" class="btn act" id="redo" disabled>
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m15 14 5-5-5-5"/><path d="M20 9H9.5a5.5 5.5 0 0 0 0 11H13"/></svg>
            <span data-i18n="redo">Redo</span>
          </button>
          <button type="button" class="btn act" id="check">
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg>
            <span data-i18n="check">Check</span>
          </button>
          <button type="button" class="btn act" id="reveal">
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>
            <span data-i18n="reveal">Reveal</span>
          </button>
        </div>
        <div class="options">
          <label class="switch">
            <input type="checkbox" id="auto-check" role="switch">
            <span class="switch-track" aria-hidden="true"></span>
            <span class="switch-text">
              <span data-i18n="autoCheck">Mistake checking</span>
              <small data-i18n="autoCheckHint">Wrong fills turn into crosses</small>
            </span>
          </label>
          <button type="button" class="btn" id="zoom" aria-pressed="false" hidden>
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5M8 11h6"/><path class="zoom-plus" d="M11 8v6"/></svg>
            <span id="zoom-label">Zoom in</span>
          </button>
        </div>
      </div>

      <div class="result" id="result" hidden>
        <p class="result-title" id="result-title"></p>
        <p class="result-name" id="result-name"></p>
        <p class="result-time" id="result-time"></p>
        <p class="result-badge" id="result-record" data-i18n="newRecord" hidden>New best time!</p>
        <div class="result-actions">
          <button type="button" class="btn btn-primary" id="next"><span data-i18n="nextPuzzle">Next puzzle</span></button>
          <button type="button" class="btn" id="all-puzzles"><span data-i18n="allPuzzles">All puzzles</span></button>
        </div>
      </div>

      <div class="keys">
        <h3 data-i18n="keysTitle">Keyboard</h3>
        <dl>
          <div><dt><kbd data-i18n="keyArrows">Arrows</kbd></dt><dd data-i18n="keyArrowsDesc">move the cursor</dd></div>
          <div><dt><kbd data-i18n="keySpace">Space</kbd></dt><dd data-i18n="keySpaceDesc">mark with the tool</dd></div>
          <div><dt><kbd>F</kbd> <kbd>X</kbd></dt><dd data-i18n="keyFillCrossDesc">fill · cross</dd></div>
          <div><dt><kbd data-i18n="keyShift">Shift + arrows</kbd></dt><dd data-i18n="keyShiftDesc">paint a line</dd></div>
          <div><dt><kbd>Z</kbd> <kbd>Y</kbd></dt><dd data-i18n="keyUndoDesc">undo · redo</dd></div>
        </dl>
      </div>
    </aside>
  </main>

  <footer class="footer">
    <span>MIT</span> · <a href="https://github.com/celaldrg/nonogram" data-i18n="source">Source on GitHub</a>
  </footer>

  <dialog class="dialog picker" id="picker" aria-labelledby="picker-title"></dialog>

  <dialog class="dialog confirm" id="confirm" aria-labelledby="confirm-text">
    <form method="dialog" class="dialog-inner">
      <p id="confirm-text"></p>
      <div class="confirm-actions">
        <button type="submit" class="btn" value="cancel" data-i18n="cancel">Cancel</button>
        <button type="submit" class="btn btn-primary" value="ok" id="confirm-ok">OK</button>
      </div>
    </form>
  </dialog>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <div class="sr-only" id="announcer" aria-live="polite"></div>
</body>
</html>
